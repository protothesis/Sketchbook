<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dungeon Walk</title>
<meta name="description" content="Walk the procedural dungeon in 3D: every closed door is unresolved until you push it open, and the space behind it is generated as it swings." />
<link rel="stylesheet" href="app/play.css" />
</head>
<body>
  <canvas id="view" aria-label="3D dungeon view"></canvas>

  <div class="hud top-left">
    <h1>Dungeon Walk</h1>
    <p id="stats"></p>
    <div class="meter">
      <span class="meter-label">entropy</span>
      <span id="charges" class="charges"></span>
      <span id="shard-pips" class="pips" title="Shards toward the next charge"></span>
      <span class="keys" title="Keys open locked doors">&#9911; <span id="keys-num">0</span></span>
      <span id="stance" class="stance"></span>
    </div>
    <div class="hud-buttons">
      <a class="btn" href="index.html">Chart view</a>
      <button class="btn" id="new-btn" type="button">New map</button>
    </div>
  </div>

  <canvas id="minimap" class="hud minimap" width="180" height="180" aria-label="Minimap (tap to enlarge)" title="Open the map (M)"></canvas>

  <div id="bigmap" class="bigmap" hidden>
    <canvas id="bigmap-canvas" aria-label="Map"></canvas>
    <div class="bigmap-bar">
      <span class="legend"><i class="sw sw-open"></i>unopened <i class="sw sw-lock"></i>locked <i class="sw sw-opened"></i>opened <i class="sw sw-trace"></i>trace</span>
      <button class="btn" id="bigmap-center" type="button">Center</button>
      <button class="btn" id="bigmap-close" type="button">Close (M)</button>
    </div>
  </div>

  <button id="crouch-btn" class="crouch-btn" type="button" title="Crouch (C)">crouch</button>

  <button id="prompt" class="prompt" type="button" hidden></button>
  <p id="caption" class="caption"></p>

  <div class="hud bottom-left help">
    <kbd>WASD</kbd> move · <kbd>Shift</kbd> run · <kbd>C</kbd> crouch · <kbd>E</kbd> open / unlock / collapse ·
    <kbd>M</kbd> map · <kbd>N</kbd> new
  </div>

  <div id="stick" class="stick" hidden><div class="knob"></div></div>

  <div id="done" class="done" hidden>
    <div class="done-card">
      <p class="done-kicker" id="done-kicker">checkpoint</p>
      <h2 id="done-title">The locked door gives.</h2>
      <p class="done-lede" id="done-lede"></p>
      <p class="done-seed">root seed <code id="done-seed"></code></p>
      <h3>The chain to this door</h3>
      <ol id="done-chain" class="chain"></ol>
      <h3>Tally</h3>
      <dl id="done-stats" class="tally"></dl>
      <div class="done-buttons">
        <button class="btn primary" id="done-continue" type="button">Continue down</button>
        <button class="btn" id="done-leave" type="button">Leave the dungeon</button>
        <button class="btn primary" id="done-new" type="button">New expedition</button>
        <button class="btn" id="done-export" type="button">Export record</button>
        <a class="btn" id="done-chart" href="index.html">Chart view</a>
      </div>
    </div>
  </div>

  <script src="vendor/three/three.min.js"></script>
  <script src="engine/rng.js"></script>
  <script src="engine/shapes.js"></script>
  <script src="engine/expedition.js"></script>
  <script src="app/play-rules.js"></script>
  <script src="app/play.js"></script>
</body>
</html>
