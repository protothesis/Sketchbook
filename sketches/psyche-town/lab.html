<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Psyche Lab</title>
<meta name="description" content="One person's psyche as a little orrery: the ego as a sun, archetypes as planets, aspects as weather." />
<link rel="stylesheet" href="ui/base.css" />
<style>
  main { flex: 1; display: flex; min-height: 0; }
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 8px 12px 12px; }
  #orrery { flex: 1; width: 100%; min-height: 320px; display: block; touch-action: manipulation; }
  .stagebar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--text-muted); }
  .stagebar label { display: flex; align-items: center; gap: 6px; }
  #panel { width: 380px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--surface); overflow-y: auto; padding: 14px 16px 28px; }
  .who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .who h2 { font-size: 22px; text-transform: none; letter-spacing: 0; color: var(--text); margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
  .row label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); }
  #state { margin: 10px 0; }
  .events { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 5px; }
  .events button { font-size: 12px; padding: 5px 6px; }
  .events button.kind { border-color: color-mix(in srgb, var(--good) 50%, var(--border)); }
  @media (max-width: 860px) {
    main { flex-direction: column; }
    .stage { flex: none; padding: 8px 16px; }
    #orrery { flex: none; height: min(100vw, 520px); }
    #panel { width: auto; border-left: 0; border-top: 1px solid var(--border); overflow: visible; }
  }
</style>
</head>
<body>
<header class="top">
  <h1><a href="../../index.html" title="Back to the Sketchbook">←</a> Psyche Lab</h1>
  <nav class="pages"><a href="index.html">Town</a><a href="lab.html" aria-current="page">Lab</a><a href="wiki.html">Wiki</a></nav>
</header>
<main>
  <div class="stage">
    <canvas id="orrery" aria-label="This person's psyche as an orrery. Tap a planet, the sun or the shield to read about it."></canvas>
    <div class="stagebar">
      <button id="play">Pause</button>
      <label>Speed <select id="speed"><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select></label>
      <span id="clock"></span>
      <span>· Tap anything in the orrery to read about it.</span>
    </div>
  </div>
  <aside id="panel">
    <div class="who"><h2 id="name"></h2><span id="type"></span></div>
    <div class="row">
      <button id="reroll">New person</button>
      <label>Type <select id="pick-type"><option value="">Random</option></select></label>
      <label>Archetypes <select id="pick-size"><option value="">Random</option></select></label>
    </div>
    <p id="state"></p>
    <div class="bars">
      <span><a href="#" data-wiki="concept-shield">Shield (hold)</a></span><div class="bar"><i class="hold" id="hold"></i></div>
      <span>Fatigue</span><div class="bar"><i id="fatigue"></i></div>
    </div>

    <h2><a href="#" data-wiki="concept-pull">Tug of war</a></h2>
    <div id="tug"></div>
    <p class="hint">Each planet's pull on the ego. The blue mark is the ego's hold; whoever crosses it takes over.</p>

    <h2><a href="#" data-wiki="concept-aspects">Weather</a></h2>
    <div id="weather"></div>

    <h2>Happenings</h2>
    <div class="events" id="events"></div>
    <div class="row">
      <button id="sit">Sit with them</button>
      <button id="rest">Let them sleep</button>
      <button id="night">Night</button>
      <button id="company">In company</button>
    </div>

    <h2>Log</h2>
    <ul class="log" id="log"></ul>
  </aside>
</main>

<script src="engine/archetypes.js"></script>
<script src="engine/psyche.js"></script>
<script src="ui/render.js"></script>
<script src="ui/wiki.js"></script>
<script src="ui/panel.js"></script>
<script src="ui/orrery.js"></script>
<script src="ui/lab.js"></script>
</body>
</html>
