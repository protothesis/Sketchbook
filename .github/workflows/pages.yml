name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue rather than cancel: each run regenerates the index from the latest
# main, so runs must not race each other's commits.
concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as in GitHub's own Pages template: uploading in one job and
# deploying from another gives the artifact time to become visible.
# deploy-pages run in the same job as the upload has failed with "No
# artifacts named github-pages were found" (and a re-run of that run then
# fails with "Multiple artifacts"; start a fresh run instead).
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the regenerated gallery index
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sketch branches only add sketches/<slug>/sketch.json; the shared
      # sketches.data.js and README table are rebuilt here so parallel
      # branches never conflict on them. A push made with GITHUB_TOKEN
      # doesn't retrigger this workflow, so there's no loop.
      - name: Regenerate gallery index
        run: |
          git fetch origin main
          git reset --hard origin/main
          node tools/build-index.js
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -am "Regenerate gallery index [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
