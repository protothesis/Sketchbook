<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sketchbook</title>
<meta name="description" content="A gallery of on-the-fly prototypes and sketches." />
<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --border: #e4e1da;
    --text: #1c1b19;
    --text-muted: #6b6a64;
    --accent: #b35c2e;
    --accent-soft: #f3e4d9;
    --shadow: 0 1px 2px rgba(28, 27, 25, 0.06), 0 4px 12px rgba(28, 27, 25, 0.04);
    --radius: 12px;
    --status-seed: #6b6a64;
    --status-prototype: #a3762b;
    --status-active: #2f7d4f;
    --status-archived: #8b8a84;
    --status-graduated: #5b5fc7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513;
      --surface: #201f1c;
      --border: #34322d;
      --text: #f2f0ea;
      --text-muted: #9c9a92;
      --accent: #e08a4f;
      --accent-soft: #3a2a1d;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
      --status-seed: #9c9a92;
      --status-prototype: #d4a349;
      --status-active: #4fae7c;
      --status-archived: #6f6d67;
      --status-graduated: #9a9cf0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161513;
    --surface: #201f1c;
    --border: #34322d;
    --text: #f2f0ea;
    --text-muted: #9c9a92;
    --accent: #e08a4f;
    --accent-soft: #3a2a1d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    --status-seed: #9c9a92;
    --status-prototype: #d4a349;
    --status-active: #4fae7c;
    --status-archived: #6f6d67;
    --status-graduated: #9a9cf0;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 16px 80px;
  }
  header {
    margin-bottom: 40px;
  }
  h1 {
    font-size: 2rem;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--text-muted);
    margin: 0;
    font-size: 1.02rem;
    max-width: 60ch;
  }
  header a {
    color: var(--accent);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .card h2 {
    font-size: 1.05rem;
    margin: 0;
    line-height: 1.3;
  }
  .status {
    flex-shrink: 0;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    white-space: nowrap;
  }
  .status[data-status="seed"] { color: var(--status-seed); }
  .status[data-status="prototype"] { color: var(--status-prototype); }
  .status[data-status="active"] { color: var(--status-active); }
  .status[data-status="archived"] { color: var(--status-archived); }
  .status[data-status="graduated"] { color: var(--status-graduated); }

  /* Closed sketches (archived / graduated): quieter, with what became of them. */
  .card.closed { background: transparent; box-shadow: none; }
  .card.closed h2, .card.closed p.description { opacity: 0.75; }
  .closing {
    margin: 0;
    font-size: 0.85rem;
    line-height: 1.4;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--accent-soft);
    border-left: 3px solid var(--status-graduated);
  }
  .card.closed[data-status="archived"] .closing { border-left-color: var(--status-archived); }
  .closing .successor { font-weight: 600; color: var(--status-graduated); }
  .closing a.successor { text-decoration: underline; }
  .closing .when { display: block; color: var(--text-muted); font-size: 0.75rem; margin-top: 2px; }

  .card p.description {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.92rem;
    line-height: 1.45;
    flex-grow: 1;
  }
  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tag {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 7px;
    font-size: 0.72rem;
    color: var(--text-muted);
  }
  .demo-badge {
    color: var(--accent);
    font-weight: 600;
  }

  .empty {
    color: var(--text-muted);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    font-size: 0.95rem;
  }
  .error {
    color: var(--status-prototype);
  }
</style>
</head>
<body>
  <main>
    <header>
      <h1>Sketchbook</h1>
      <p>
        On-the-fly prototypes and early-stage ideas. Each card links to a
        live demo when one exists, or to the sketch's source otherwise.
        See the <a href="https://github.com/protothesis/sketchbook">repository</a>
        for details.
      </p>
    </header>
    <div id="grid" class="grid" aria-live="polite"></div>
  </main>

  <script src="sketches.data.js"></script>
  <script>
    const STATUS_LABEL = {
      seed: "Seed",
      prototype: "Prototype",
      active: "Active",
      archived: "Archived",
      graduated: "Graduated",
    };

    function cardFor(sketch) {
      const href = sketch.demo || `sketches/${sketch.slug}/README.md`;
      const status = (sketch.status || "seed").toLowerCase();
      const tags = Array.isArray(sketch.tags) ? sketch.tags : [];

      const card = document.createElement("a");
      card.className = "card";
      card.href = href;

      const top = document.createElement("div");
      top.className = "card-top";

      const title = document.createElement("h2");
      title.textContent = sketch.title || sketch.slug;
      top.appendChild(title);

      const statusEl = document.createElement("span");
      statusEl.className = "status";
      statusEl.dataset.status = status;
      statusEl.textContent = STATUS_LABEL[status] || status;
      top.appendChild(statusEl);

      card.appendChild(top);

      if (sketch.description) {
        const desc = document.createElement("p");
        desc.className = "description";
        desc.textContent = sketch.description;
        card.appendChild(desc);
      }

      // Closed sketches say what became of them (and link the successor
      // once it has a public URL; the card itself still opens the demo).
      if (sketch.status === "archived" || sketch.status === "graduated") {
        card.classList.add("closed");
        card.dataset.status = sketch.status;
        const box = document.createElement("p");
        box.className = "closing";
        const s = sketch.successor;
        if (s) {
          box.append("Graduated → ");
          const name = document.createElement(s.url ? "span" : "span");
          name.className = "successor";
          name.textContent = s.title;
          if (s.url) {
            name.setAttribute("role", "link");
            name.tabIndex = 0;
            name.style.cursor = "pointer";
            const go = (e) => {
              e.preventDefault();
              e.stopPropagation();
              window.open(s.url, "_blank", "noopener");
            };
            name.addEventListener("click", go);
            name.addEventListener("keydown", (e) => e.key === "Enter" && go(e));
          }
          box.appendChild(name);
          if (!s.url && s.repo) box.append(" (private)");
        } else if (sketch.outcome) {
          box.append(sketch.outcome);
        }
        if (sketch.closed || (s && sketch.outcome)) {
          const when = document.createElement("span");
          when.className = "when";
          when.textContent = [s && sketch.outcome, sketch.closed && `Closed ${sketch.closed}`].filter(Boolean).join(" · ");
          box.appendChild(when);
        }
        card.appendChild(box);
      }

      const meta = document.createElement("div");
      meta.className = "card-meta";

      const tagWrap = document.createElement("div");
      tagWrap.className = "tags";
      tags.forEach((t) => {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = t;
        tagWrap.appendChild(tag);
      });
      meta.appendChild(tagWrap);

      if (sketch.demo) {
        const badge = document.createElement("span");
        badge.className = "demo-badge";
        badge.textContent = "Live demo →";
        meta.appendChild(badge);
      } else if (sketch.date) {
        const date = document.createElement("span");
        date.textContent = sketch.date;
        meta.appendChild(date);
      }

      card.appendChild(meta);
      return card;
    }

    function render() {
      const grid = document.getElementById("grid");
      const sketches = Array.isArray(window.SKETCHES) ? window.SKETCHES : null;

      if (!sketches) {
        grid.innerHTML = "";
        const errorEl = document.createElement("p");
        errorEl.className = "empty error";
        errorEl.textContent = "Couldn't load sketches.data.js.";
        grid.appendChild(errorEl);
        return;
      }

      grid.innerHTML = "";
      if (sketches.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No sketches yet — check back soon.";
        grid.appendChild(empty);
        return;
      }

      sketches
        .slice()
        .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
        .forEach((sketch) => grid.appendChild(cardFor(sketch)));
    }

    render();
  </script>
</body>
</html>
